<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="610" viewBox="0 0 1180 610"
     role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">Professional technical profile hero</title>
  <desc id="desc">A premium terminal-inspired GitHub profile banner with a visual identity panel and system information panel. Profile fields are placeholders until populated with supplied data.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#030712"/>
      <stop offset=".52" stop-color="#07111F"/>
      <stop offset="1" stop-color="#0B1220"/>
      <animateTransform attributeName="gradientTransform" type="rotate" from="0 .5 .5" to="360 .5 .5" dur="36s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset=".5" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#10B981"/>
      <animate attributeName="x1" values="0;0.25;0" dur="9s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17243A" stop-opacity=".62"/>
      <stop offset="1" stop-color="#0B1323" stop-opacity=".28"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#22D3EE" stop-opacity=".18"/>
      <stop offset=".65" stop-color="#7C3AED" stop-opacity=".07"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#94A3B8" stroke-opacity=".055"/>
    </pattern>
    <pattern id="scan" width="1" height="8" patternUnits="userSpaceOnUse">
      <rect width="1" height="1" fill="#22D3EE" opacity=".08"/>
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <clipPath id="frameClip"><rect x="12" y="12" width="1156" height="586" rx="24"/></clipPath>
    <clipPath id="portraitClip"><rect x="74" y="137" width="390" height="292" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#frameClip)">
    <rect width="1180" height="610" fill="url(#bg)"/>
    <circle cx="270" cy="245" r="330" fill="url(#halo)"/>
    <circle cx="1000" cy="470" r="270" fill="url(#halo)" opacity=".55"/>
    <rect width="1180" height="610" fill="url(#grid)"/>
    <rect width="1180" height="610" fill="url(#scan)"/>

    <!-- ambient particles -->
    <g fill="#22D3EE" opacity=".42">
      <circle cx="610" cy="72" r="1.4"><animate attributeName="cy" values="72;52;72" dur="7s" repeatCount="indefinite"/></circle>
      <circle cx="1070" cy="164" r="1.1"><animate attributeName="cy" values="164;184;164" dur="8s" repeatCount="indefinite"/></circle>
      <circle cx="720" cy="542" r="1.3"><animate attributeName="cx" values="720;748;720" dur="10s" repeatCount="indefinite"/></circle>
      <circle cx="1020" cy="330" r="1"><animate attributeName="cy" values="330;312;330" dur="6s" repeatCount="indefinite"/></circle>
    </g>

    <!-- outer frame -->
    <rect x="12" y="12" width="1156" height="586" rx="24" fill="none" stroke="#334155" stroke-opacity=".72"/>
    <rect x="13" y="13" width="1154" height="584" rx="23" fill="none" stroke="url(#accent)" stroke-opacity=".48">
      <animate attributeName="stroke-opacity" values=".28;.58;.28" dur="8s" repeatCount="indefinite"/>
    </rect>

    <!-- terminal top bar -->
    <rect x="28" y="28" width="1124" height="46" rx="14" fill="#0B1323" fill-opacity=".84" stroke="#334155" stroke-opacity=".7"/>
    <circle cx="52" cy="51" r="6" fill="#EF4444"/>
    <circle cx="74" cy="51" r="6" fill="#F59E0B"/>
    <circle cx="96" cy="51" r="6" fill="#10B981"/>
    <text x="125" y="56" fill="#CBD5E1" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace">
      profile@developer:~ <tspan fill="#22D3EE">[ ONLINE ]</tspan>
    </text>
    <text x="1118" y="56" text-anchor="end" fill="#64748B" font-size="11" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace">GITHUB / PROFILE</text>

    <!-- left panel -->
    <rect x="42" y="92" width="470" height="478" rx="20" fill="url(#glass)" stroke="#475569" stroke-opacity=".55"/>
    <rect x="43" y="93" width="468" height="476" rx="19" fill="none" stroke="url(#accent)" stroke-opacity=".25"/>

    <text x="277" y="121" text-anchor="middle" fill="#67E8F9" font-size="11" letter-spacing="2.6"
          font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace">VISUAL.MAP</text>

    <!-- ASCII portrait placeholder -->
    <rect x="74" y="137" width="390" height="292" rx="16" fill="#020617" fill-opacity=".62" stroke="#334155" stroke-opacity=".7"/>
    <g clip-path="url(#portraitClip)" fill="#A5F3FC" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace"
       font-size="9" letter-spacing="1.1">
      <text x="91" y="158" opacity=".20">................................................</text>
      <text x="91" y="168" opacity=".25">...............:::::::::::::::..................</text>
      <text x="91" y="178" opacity=".31">.........:::::::+++++++:::::::.................</text>
      <text x="91" y="188" opacity=".38">......::::++*************++::::..............</text>
      <text x="91" y="198" opacity=".45">....::++***###########***++::................</text>
      <text x="91" y="208" opacity=".52">...:+**###%%%%%%%%%%%%%###**+:..............</text>
      <text x="91" y="218" opacity=".60">..:+**##%%@@@@@@@@@@@@@%%##**+:.............</text>
      <text x="91" y="228" opacity=".68">..+*##%%@@@%%%%#%%%%@@@%%##*+.................</text>
      <text x="91" y="238" opacity=".76">.:*##%%@@%%##*+++*##%%@@%%##*:.................</text>
      <text x="91" y="248" opacity=".84">.:*##%%@@%#*:.   .:*#%@@%%##*:.................</text>
      <text x="91" y="258" opacity=".90">.:*##%%@@%#:.  ... .:#%@@%%##*:.................</text>
      <text x="91" y="268" opacity=".92">.:*##%%@@%#: .:::::. :#%@@%%##*:................</text>
      <text x="91" y="278" opacity=".94">.:*##%%@@%#*::+++++:::#%@@%%##*:................</text>
      <text x="91" y="288" opacity=".92">..*##%%@@%%#*+++++++*#%%@@%%##*.................</text>
      <text x="91" y="298" opacity=".86">..+*##%%@@%%##*+++*##%%@@%%##*+.................</text>
      <text x="91" y="308" opacity=".80">...+*##%%@@@%%#####%%@@@%%##*+..................</text>
      <text x="91" y="318" opacity=".70">....:+**##%%@@@@@@@@@%%##**+:...................</text>
      <text x="91" y="328" opacity=".60">......:+***###########***+:.....................</text>
      <text x="91" y="338" opacity=".48">.........:+***********+:........................</text>
      <text x="91" y="348" opacity=".38">............:+++++++:...........................</text>
      <text x="91" y="358" opacity=".30">..............:::::.............................</text>
      <text x="91" y="368" opacity=".24">.................................................</text>
      <text x="91" y="378" opacity=".20">....{PORTRAIT_ASCII_OPTIONAL}................</text>
      <text x="91" y="398" opacity=".14">.................................................</text>
      <g opacity=".34">
        <rect x="74" y="137" width="390" height="2" fill="#22D3EE">
          <animateTransform attributeName="transform" type="translate" from="0 0" to="0 292" dur="5.5s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>

    <text x="277" y="455" text-anchor="middle" fill="#F8FAFC" font-size="25" font-weight="700"
          font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace">{{NAME}}</text>
    <text x="277" y="479" text-anchor="middle" fill="#67E8F9" font-size="13"
          font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace">{{PROFESSIONAL_HEADLINE}}</text>
    <text x="277" y="509" text-anchor="middle" fill="#94A3B8" font-size="12"
          font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace">{{PERSONAL_TAGLINE}}</text>
    <text x="82" y="546" fill="#64748B" font-size="11"
          font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace">~/profile $ </text>
    <text x="151" y="546" fill="#A7F3D0" font-size="11"
          font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace">build --ship</text>
    <rect x="232" y="537" width="7" height="12" fill="#22D3EE" opacity=".85">
      <animate attributeName="opacity" values=".2;1;.2" dur="1.1s" repeatCount="indefinite"/>
    </rect>

    <!-- right system panel -->
    <rect x="532" y="92" width="606" height="478" rx="20" fill="url(#glass)" stroke="#475569" stroke-opacity=".55"/>
    <rect x="533" y="93" width="604" height="476" rx="19" fill="none" stroke="url(#accent)" stroke-opacity=".22"/>
    <text x="565" y="125" fill="#F8FAFC" font-size="18" font-weight="700"
          font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace">SYSTEM.INFO</text>
    <text x="1105" y="125" text-anchor="end" fill="#64748B" font-size="10" letter-spacing="1.8"
          font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace">PROFILE.SH</text>
    <line x1="565" y1="143" x2="1105" y2="143" stroke="#334155" stroke-opacity=".65"/>

    <text x="565" y="171" fill="#64748B" font-size="11" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace">user@developer:~$ ./profile.sh</text>

    <!-- information rows -->
    <g font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="12">
      <text x="565" y="204" fill="#67E8F9">NAME</text><text x="700" y="204" fill="#F8FAFC">{{NAME}}</text>
      <text x="565" y="234" fill="#67E8F9">ROLE</text><text x="700" y="234" fill="#F8FAFC">{{PRIMARY_ROLE}}</text>
      <text x="565" y="264" fill="#67E8F9">COMPANY</text><text x="700" y="264" fill="#F8FAFC">{{CURRENT_COMPANY}}</text>
      <text x="565" y="294" fill="#67E8F9">LOCATION</text><text x="700" y="294" fill="#F8FAFC">{{LOCATION}}</text>
      <text x="565" y="324" fill="#67E8F9">EXPERIENCE</text><text x="700" y="324" fill="#F8FAFC">{{EXPERIENCE}}</text>
      <text x="565" y="354" fill="#67E8F9">FOCUS</text><text x="700" y="354" fill="#F8FAFC">{{FOCUS}}</text>
      <text x="565" y="384" fill="#67E8F9">STACK</text><text x="700" y="384" fill="#F8FAFC">{{PRIMARY_TECHNOLOGIES}}</text>
      <text x="565" y="414" fill="#67E8F9">BUILDING</text><text x="700" y="414" fill="#F8FAFC">{{CURRENT_BUILDING_FOCUS}}</text>
    </g>

    <line x1="565" y1="438" x2="1105" y2="438" stroke="#334155" stroke-opacity=".65"/>
    <text x="565" y="464" fill="#94A3B8" font-size="10" letter-spacing="1.7"
          font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace">SELECTED PROOF</text>

    <g font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace">
      <circle cx="574" cy="487" r="3" fill="#10B981" filter="url(#glow)"/>
      <text x="590" y="491" fill="#F8FAFC" font-size="11">{{PROJECT_1_NAME}}</text>
      <text x="590" y="508" fill="#64748B" font-size="10">{{PROJECT_1_DESCRIPTION}}</text>
      <circle cx="846" cy="487" r="3" fill="#22D3EE" filter="url(#glow)"/>
      <text x="862" y="491" fill="#F8FAFC" font-size="11">{{PROJECT_2_NAME}}</text>
      <text x="862" y="508" fill="#64748B" font-size="10">{{PROJECT_2_DESCRIPTION}}</text>
    </g>

    <text x="565" y="544" fill="#64748B" font-size="10" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace">
      LINKS:
    </text>
    <text x="625" y="544" fill="#67E8F9" font-size="10" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace">
      GitHub · LinkedIn · Portfolio · Contact
    </text>
    <text x="1105" y="544" text-anchor="end" fill="#10B981" font-size="10"
          font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace">● READY</text>
  </g>
</svg>
